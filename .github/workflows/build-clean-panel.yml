name: Build Clean Management Panel (Locked v1.22.12)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: clean-management-panel
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: router-for-me/Cli-Proxy-API-Management-Center
  UPSTREAM_LOCKED_TAG: v1.22.12
  CLEAN_BUILD_REVISION: '2'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Find latest official release
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          
          # 锁定到 v1.22.12，不再追踪 latest
          upstream_tag="${UPSTREAM_LOCKED_TAG}"
          release_tag="clean-${upstream_tag}-r${CLEAN_BUILD_REVISION}"
          
          echo "upstream_tag=${upstream_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          
          if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout official panel
        if: steps.version.outputs.exists != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_LOCKED_TAG }}
          path: upstream

      - name: Set up Bun
        if: steps.version.outputs.exists != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Apply clean-panel customizations
        if: steps.version.outputs.exists != 'true'
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("upstream")

          def replace_once(relative_path: str, old: str, new: str) -> None:
              path = root / relative_path
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Expected one match in {relative_path}, found {count}. "
                      "The official source changed; review the clean-panel patch."
                  )
              path.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "src/router/MainRoutes.tsx",
              '''  { path: '/quick-start', element: <ProvidersWorkbenchPage fixedBrand="apikeyFun" /> },
            { path: '/quick-start/*', element: <Navigate to="/quick-start" replace /> },''',
              '''  { path: '/quick-start', element: <Navigate to="/ai-providers" replace /> },
            { path: '/quick-start/*', element: <Navigate to="/ai-providers" replace /> },''',
          )

          replace_once(
              "src/components/layout/MainLayout.tsx",
              "const NAV_TOOLTIP_VIEWPORT_MARGIN = 8;",
              "const NAV_TOOLTIP_VIEWPORT_MARGIN = 8;\nconst SHOW_SPONSORED_PROVIDERS = false;",
          )

          replace_once(
              "src/components/layout/MainLayout.tsx",
              "...(!isApiKeyFunConfigured ? [quickStartNavItem] : []),",
              "...(SHOW_SPONSORED_PROVIDERS && !isApiKeyFunConfigured ? [quickStartNavItem] : []),",
          )

          replace_once(
              "src/components/layout/MainLayout.tsx",
              "...(isApiKeyFunConfigured ? [quickStartNavItem] : []),",
              "...(SHOW_SPONSORED_PROVIDERS && isApiKeyFunConfigured ? [quickStartNavItem] : []),",
          )

          sponsor_path = root / "src/features/config/sponsors.ts"
          sponsor_text = sponsor_path.read_text(encoding="utf-8")
          sponsor_pattern = re.compile(
              r"(export const SPONSORS: readonly Sponsor\[\] = \[[\s\S]*?\n\]);"
          )
          sponsor_text, count = sponsor_pattern.subn(
              r"\1.filter(() => false);", sponsor_text, count=1
          )
          if count != 1:
              raise SystemExit(
                  "Could not disable the proxy sponsor list. The official source changed."
              )
          sponsor_path.write_text(sponsor_text, encoding="utf-8")
          PY

      - name: Install dependencies
        if: steps.version.outputs.exists != 'true'
        working-directory: upstream
        run: bun install --frozen-lockfile

      - name: Lint and build
        if: steps.version.outputs.exists != 'true'
        working-directory: upstream
        env:
          VERSION: ${{ steps.version.outputs.release_tag }}
        run: |
          bun run lint
          bun run build

      - name: Update management.html
        if: steps.version.outputs.exists != 'true'
        shell: bash
        run: |
          cp upstream/dist/index.html management.html
          printf '%s\n' '${{ steps.version.outputs.upstream_tag }}' > .upstream-version

      - name: Commit generated panel
        if: steps.version.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add management.html .upstream-version
          if ! git diff --cached --quiet; then
            git commit -m 'build: clean panel from ${{ steps.version.outputs.upstream_tag }} (locked)'
            git push
          fi

      - name: Publish release for CLIProxyAPI
        if: steps.version.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          UPSTREAM_TAG: ${{ steps.version.outputs.upstream_tag }}
        run: |
          gh release create "${RELEASE_TAG}" management.html \
            --repo "${GITHUB_REPOSITORY}" \
            --target main \
            --title "Clean panel ${UPSTREAM_TAG} (locked)" \
            --notes "Built from official ${UPSTREAM_REPOSITORY} ${UPSTREAM_TAG}. Sponsored provider shortcuts and advertising links removed. **Version locked to v1.22.12 to preserve claudeApi/code0 brand support.**"
